<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-label="Hatem Ahmad. Senior Staff Software Engineer, Frontend Architect, Founder of Enigma Technology Lab">
  <style>
    :root { --ink: #0B1020; --muted: #586087; --line: #0059FF; --dot: #DC4B4B; }
    .draw { fill: none; stroke: var(--line); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round;
            stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; animation: draw 1.1s cubic-bezier(.6,.1,.2,1) forwards; }
    .mono .draw { stroke-width: 4; }
    .bird .draw { stroke-width: 5; }
    .m1 { animation-delay: .1s; } .m2 { animation-delay: .4s; } .m3 { animation-delay: .7s; }
    .run { animation-duration: 1.3s; animation-delay: 1.4s; animation-timing-function: cubic-bezier(.45,0,.25,1); }
    .b1 { animation-duration: 1.4s; animation-delay: 2.6s; } .b2 { animation-delay: 3.4s; animation-duration: .6s; }
    text { font-family: "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; opacity: 0; animation: rise .9s ease forwards; }
    .name { font-size: 54px; font-weight: 800; fill: var(--ink); letter-spacing: -1px; animation-delay: .5s; }
    .role { font-size: 18px; font-weight: 500; fill: var(--muted); animation-delay: .9s; }
    .lab  { font-size: 18px; font-weight: 600; fill: var(--line); animation-delay: 1.1s; }
    .tip { fill: var(--dot); opacity: 0; animation: pop .4s 3.9s ease forwards; }
    @keyframes draw { from { opacity: 1; stroke-dashoffset: 1; } to { opacity: 1; stroke-dashoffset: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes pop { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .draw, text, .tip { animation: none; stroke-dashoffset: 0; opacity: 1; }
    }
  </style>

  <!-- the 2022 line-drawn H monogram -->
