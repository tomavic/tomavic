  </g>

  <text class="name" x="236" y="104">Hatem Ahmad</text>
  <text class="role" x="238" y="140">Senior Staff Software Engineer · Frontend Architect</text>
  <text class="lab"  x="238" y="168">Founder, Enigma Technology Lab</text>

  <!-- one line from the monogram, under the name, into the hummingbird -->
  <path class="draw run" pathLength="1" d="M112 201 H770 C812 201 846 178 862 132"/>

